name: Life-log trusted-main UAT GET preflight after PR CI

run-name: UAT GET-only source-${{ github.event.workflow_run.id || github.event.pull_request.number }}

on:
  # Unprivileged tests for this new workflow/guard on the PR branch.
  pull_request:
    paths:
      - '.github/workflows/life-log-uat-pr-ci-auto-preflight.yml'
      - 'scripts/uat-pr-ci-preflight-gate.mjs'
      - 'tests/uat-pr-ci-preflight-gate.test.mjs'
  # Active only once this workflow exists on the default branch.
  # A PR CI completion is a signal, NEVER trusted execution input.
  workflow_run:
    workflows:
      - Life-log local app and D1 CI
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: life-log-uat-get-only-source-${{ github.event.workflow_run.id || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Synthetic PR-CI trust-boundary and replay negative tests (no Secrets)
        run: |
          node --check scripts/uat-pr-ci-preflight-gate.mjs
          node --test tests/uat-pr-ci-preflight-gate.test.mjs

  gate:
    # Upstream failure/cancellation/PR-disabled events never reach Cloudflare.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This ref is the trusted default-branch SHA for workflow_run, NOT the PR SHA.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate upstream PR CI and current-main provenance before Secrets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          TRUSTED_MAIN_SHA: ${{ github.sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/uat-pr-ci-preflight-gate.mjs

  metadata:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      needs.gate.result == 'success'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Recheck PR, CI, current main and replay protection (no CF Secrets)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          TRUSTED_MAIN_SHA: ${{ github.sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/uat-pr-ci-preflight-gate.mjs
      - name: Existing GET-only UAT Worker metadata verification from trusted main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/uat-readonly-preflight.mjs
