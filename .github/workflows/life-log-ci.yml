name: Life-log local app and D1 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: life-log-local-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Transitional one-time artifact recovery, removed before PR approval.
      # Only package-lock metadata (no credentials or personal information) goes into logs.
      - name: Generate npm lock for controlled capture
        run: npm install --no-audit --no-fund
      - name: Emit temporary package-lock for branch-only capture
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ci/issue-7-lockfile-main-auth-tests'
        shell: bash
        run: |
          node -e 'const fs=require("node:fs"); const b=Buffer.from(JSON.stringify(JSON.parse(fs.readFileSync("package-lock.json","utf8")))).toString("base64"); const n=3000; for(let i=0;i<b.length;i+=n) console.log("LIFELOG_LOCK_CHUNK:"+Math.floor(i/n)+":"+b.slice(i,i+n)); console.log("LIFELOG_LOCK_END:"+b.length)'
      - name: Typecheck and build
        run: npm run build
      - name: Unit security and legacy tests (synthetic)
        run: npm test
      - name: Validate SQLite constraints (synthetic in-memory)
        run: npm run test:schema
      - name: Apply migrations ONLY to Wrangler local D1
        run: npm run db:migrate:local
      - name: Re-apply local D1 migrations to verify idempotence
        run: npm run db:migrate:local
      - name: Insert synthetic fixtures ONLY into local D1
        run: npm run db:fixture:local
      - name: Confirm schema/fixtures in local Wrangler D1
        run: npx --no-install wrangler d1 execute life-log-dev --local --command "SELECT count(*) AS n FROM body_measurements"
