name: Life-log local app and D1 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: life-log-local-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install pinned npm dependencies (no Cloudflare credentials)
        run: npm ci --no-audit --no-fund
      - name: Verify integration CI, read-only workflow and issue closing gates (offline)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node scripts/verify-integration-gates.mjs --self-test
          node scripts/verify-integration-gates.mjs
      - name: Verify remote D1 schema workflow without network or credentials
        run: node --test scripts/d1-schema-readonly.check.mjs
      - name: Verify package-lock stays unchanged
        run: git diff --exit-code -- package-lock.json
      - name: Reject unsupported Worker PBKDF2 iterations and verify guard fixtures
        run: |
          python3 scripts/check-cloudflare-kdf.py --self-test
          python3 scripts/check-cloudflare-kdf.py .
      - name: Typecheck and build
        run: npm run build
      - name: Unit security and legacy tests (synthetic, serialized browser files)
        # Several suites launch real Chromium. Never overlap their browser processes
        # inside a single runner; no test is skipped.
        run: npm test -- --no-file-parallelism
      - name: Validate SQLite constraints (synthetic in-memory)
        run: npm run test:schema
      - name: Apply migrations ONLY to Wrangler local D1
        run: npm run db:migrate:local
      - name: Re-apply local D1 migrations to verify idempotence
        run: npm run db:migrate:local
      - name: Insert synthetic fixtures ONLY into local D1
        run: npm run db:fixture:local
      - name: Confirm schema/fixtures in local Wrangler D1
        run: npx --no-install wrangler d1 execute life-log-dev --local --command "SELECT count(*) AS n FROM body_measurements"
      - name: Local Workerd passkey-only session, retired password endpoints and app API
        run: bash scripts/verify-password-uat-local.sh

  chromium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install pinned dependencies (no Cloudflare credentials)
        run: npm ci --no-audit --no-fund
      - name: Real 390px Chromium E2E against actual Vite app, synthetic APIs only
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          test -x "$CHROME_BIN"
          node scripts/eclear-390-chromium-e2e.mjs

  worker-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install pinned dependencies without Cloudflare credentials
        run: npm ci --no-audit --no-fund
      - name: Build private app assets for real local Workerd
        run: npm run build
      - name: Chromium + virtual CTAP2 + real Workerd + isolated synthetic D1
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          test -x "$CHROME_BIN"
          bash scripts/eclear-worker-browser-local.sh
