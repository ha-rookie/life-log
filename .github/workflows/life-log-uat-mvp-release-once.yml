name: Life-log one-shot complete MVP UAT release and integrated acceptance
on:
  workflow_run:
    workflows: ["Life-log local app and D1 CI"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: life-log-mvp-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  deploy-and-accept:
    if: >-
      github.repository == 'ha-rookie/life-log' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_commit.message, 'feat(mvp): complete life log ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      UAT_URL: https://life-log-uat.ha-rookie.workers.dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Pin exact authorized SHA, changed files, UAT target and no migrations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$TARGET_SHA"
          git show -s --format=%s HEAD | grep -Eq '^feat\(mvp\): complete life log \(#[0-9]+\)$'
          git diff-tree --no-commit-id --name-only -r HEAD | sort > "$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            .github/workflows/life-log-uat-mvp-release-once.yml \
            docs/06_REQUIREMENTS_TRACEABILITY.md \
            scripts/uat-mvp-e2e.mjs \
            src/client/App.tsx \
            src/client/MvpFeatures.tsx \
            src/client/styles.css \
            src/worker/index.ts \
            src/worker/mvp-features.ts \
            tests/mvp-features.test.ts | sort > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8').split(/\r?\n/)
            .filter(x=>!x.trimStart().startsWith('//')).join('\n'));
          const u=cfg.env?.uat,d=u?.d1_databases?.[0];
          if(u?.name!=='life-log-uat'||u?.workers_dev!==true||
             u.d1_databases?.length!==1||d?.binding!=='DB'||
             d.database_id!=='421d0116-5c33-4782-a2b6-28f9684d3956'||
             d.database_name!=='life-log-dev'||
             u.vars?.MANUAL_REMOTE_WRITE_ENABLED!=='false'||
             u.vars?.MANUAL_REMOTE_TARGET!=='uat'||
             u.vars?.MANUAL_REMOTE_ORIGIN!=='https://life-log-uat.ha-rookie.workers.dev')
             throw Error('UAT configuration drift');
          if(!fs.readFileSync('src/worker/mvp-features.ts','utf8').includes('handleMvpFeatures'))
             throw Error('MVP changes not present');
          JS
      - name: Install locked deps, build approved main and verify existing D1 metadata
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          curl -fsS --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/421d0116-5c33-4782-a2b6-28f9684d3956" \
            | jq -e '.success == true and .result.uuid == "421d0116-5c33-4782-a2b6-28f9684d3956" and .result.name == "life-log-dev"' >/dev/null
      - name: Deploy only existing UAT Worker (no Migration, no Secrets changes)
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler deploy --env uat \
            --var PASSWORD_ONLY_UAT:true MANUAL_REMOTE_WRITE_ENABLED:true \
                  MANUAL_REMOTE_TARGET:uat \
                  MANUAL_REMOTE_ORIGIN:https://life-log-uat.ha-rookie.workers.dev
      - name: Verify protected UAT UI and abandoned password endpoints
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            login=$(curl -sS --max-time 15 -o "$RUNNER_TEMP/login.html" -w '%{http_code}' "$UAT_URL/login" || true)
            anon=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$UAT_URL/" || true)
            retired=$(curl -sS --max-time 15 -o "$RUNNER_TEMP/retired.json" -w '%{http_code}' \
              -X POST "$UAT_URL/api/auth/login" \
              -H "Origin: $UAT_URL" -H "Sec-Fetch-Site: same-origin" \
              -H "Content-Type: application/json" -H "X-Life-Log-Intent: register-v1" \
              --data '{"username":"owner","password":"synthetic-unused"}' || true)
            if [[ "$login" == 200 && "$anon" == 403 && "$retired" == 410 ]] &&
                grep -Fq 'パスキーでログイン' "$RUNNER_TEMP/login.html"; then
              echo "PASS: UAT login 200, protected root 403, password API retired 410"
              exit 0
            fi
            if [[ "$anon" == 200 ]]; then echo "Unsafe anonymous access"; exit 1; fi
            if [[ "$i" -lt 15 ]]; then sleep 4; fi
          done
          echo "UAT HTTP smoke failed"; exit 1
      - name: Real UAT MVP API and D1 synthetic end-to-end acceptance with cleanup
        shell: bash
        run: |
          set -euo pipefail
          node scripts/uat-mvp-e2e.mjs
