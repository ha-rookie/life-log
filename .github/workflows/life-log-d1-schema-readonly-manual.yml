name: Life-log manual ECLEAR D1 schema and migration metadata only

# This workflow NEVER runs on push, PR, workflow_run or schedule.
# A future dispatch requires separate approval; even main merging it is not
# approval to run Remote D1 metadata reads.
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact approved current 40-character main SHA'
        type: string
        required: true
      confirmation:
        description: 'Enter READ LIFELOG D1 SCHEMA ONLY after separate read authorization'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: life-log-d1-eclear-schema-readonly-manual
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'ha-rookie/life-log' &&
      inputs.confirmation == 'READ LIFELOG D1 SCHEMA ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enforce manual event, current exact main SHA and fixed UAT D1
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REPOSITORY" = 'ha-rookie/life-log'
          test "$CONFIRMATION" = 'READ LIFELOG D1 SCHEMA ONLY'
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$TARGET_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$TARGET_SHA"
          node --input-type=module <<'JS'
          import {readFileSync} from "node:fs";
          import {validateLocalConfig} from "./scripts/d1-schema-readonly.mjs";
          validateLocalConfig(readFileSync("wrangler.jsonc","utf8"));
          console.log("PASS: exact approved SHA and pinned local UAT D1 metadata contract");
          JS
      - name: Offline SQL allowlist, redaction and trigger negative tests
        run: node --test scripts/d1-schema-readonly.check.mjs
      - name: Inspect D1 schema metadata ONLY (separately approved dispatch)
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
          # Secrets are NEVER passed to the preliminary validation or test steps.
          # Token should have Cloudflare D1 Read permission only; no changes now.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # Do not turn on shell tracing, dump environment or print API response bodies.
          node scripts/d1-schema-readonly.mjs --remote
