name: Life-log UAT GET-only Worker metadata preflight

on:
  pull_request:
    paths:
      - '.github/workflows/life-log-uat-readonly-preflight.yml'
      - 'scripts/uat-readonly-preflight.mjs'
      - 'tests/uat-readonly-preflight.test.mjs'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact approved current main SHA (40 lowercase hex)'
        required: true
        type: string
      confirmation:
        description: 'Must equal CHECK LIFELOG UAT METADATA ONLY'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: life-log-uat-get-only-preflight
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Require separately approved manual preflight on exact main
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = 'CHECK LIFELOG UAT METADATA ONLY'
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$TARGET_SHA"
      - name: Install pinned dependencies (no Cloudflare credentials)
        run: npm ci --no-audit --no-fund
      - name: Test fail-closed metadata verifier with synthetic fixtures
        run: npx --no-install vitest run tests/uat-readonly-preflight.test.mjs
      - name: Verify GET-only script syntax and app build offline
        run: |
          node --check scripts/uat-readonly-preflight.mjs
          npm run build

  metadata:
    # Never on PR/push; independent of existing UAT deploy and release workflows.
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: GET-only existing UAT Worker settings (no writes or D1)
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = 'CHECK LIFELOG UAT METADATA ONLY'
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$TARGET_SHA"
          node scripts/uat-readonly-preflight.mjs
