name: Life-log one-shot real UAT manual weight and steps acceptance
on:
  workflow_run:
    workflows: ["Life-log local app and D1 CI"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: life-log-manual-e2e
  cancel-in-progress: false
jobs:
  acceptance:
    if: >-
      github.repository == 'ha-rookie/life-log' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_commit.message, 'test(uat): remote manual acceptance retry ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      UAT_URL: https://life-log-uat.ha-rookie.workers.dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Assert exact merged scope and existing UAT Cloudflare target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$TARGET_SHA"
          git show -s --format=%s HEAD | grep -Eq '^test\(uat\): remote manual acceptance retry \(#[0-9]+\)$'
          git diff-tree --no-commit-id --name-only -r HEAD | sort > "$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            .github/workflows/life-log-uat-manual-entry-acceptance-once.yml | sort > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const cfg=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8").split(/\r?\n/)
            .filter(x=>!x.trimStart().startsWith("//")).join("\n"));
          const u=cfg.env?.uat,d=u?.d1_databases?.[0];
          if(u?.name!=="life-log-uat"||u?.workers_dev!==true||
            u.d1_databases?.length!==1||d?.binding!=="DB"||
            d.database_name!=="life-log-dev"||
            d.database_id!=="421d0116-5c33-4782-a2b6-28f9684d3956"||
            u.vars?.MANUAL_REMOTE_WRITE_ENABLED!=="false"||
            u.vars?.MANUAL_REMOTE_TARGET!=="uat"||
            u.vars?.MANUAL_REMOTE_ORIGIN!=="https://life-log-uat.ha-rookie.workers.dev")
              throw Error("Cloudflare target no longer pinned to existing UAT");
          JS
      - name: Install pinned Wrangler and verify remote database identity
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/421d0116-5c33-4782-a2b6-28f9684d3956" \
            | jq -e '.success == true and .result.uuid == "421d0116-5c33-4782-a2b6-28f9684d3956" and .result.name == "life-log-dev"' >/dev/null
          login=$(curl -sS --max-time 15 -o "$RUNNER_TEMP/login.html" -w '%{http_code}' "$UAT_URL/login")
          root=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$UAT_URL/")
          test "$login" = 200
          test "$root" = 403
          grep -Fq 'パスキーでログイン' "$RUNNER_TEMP/login.html"
          if grep -Fq 'id="password"' "$RUNNER_TEMP/login.html"; then
            echo "Temporary password UI unexpectedly present"; exit 1
          fi
      - name: Live UAT authenticated weight and steps CRUD with complete cleanup
        shell: bash
        run: |
          set -euo pipefail
          node scripts/uat-manual-entry-e2e.mjs
