name: Life-log guarded UAT UI update (manual only)

on:
  pull_request:
    paths:
      - '.github/workflows/life-log-uat-ui-update.yml'
      - 'scripts/uat-ui-release-guard.mjs'
      - 'tests/uat-ui-release-guard.test.mjs'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact current approved main SHA (40 lowercase hex)'
        required: true
        type: string
      confirmation:
        description: 'Must equal DEPLOY LIFELOG UAT UI ONLY'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: life-log-uat-ui-update
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Require manual approval and exact current main on dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = 'DEPLOY LIFELOG UAT UI ONLY'
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$TARGET_SHA"
          git merge-base --is-ancestor 54f2b4732baafbeb143ac2943867535e5a6f3b99 "$TARGET_SHA"
          # Never mix a later runtime/auth/config/schema change into this UI-only release.
          git diff --exit-code 54f2b4732baafbeb143ac2943867535e5a6f3b99 "$TARGET_SHA" -- \
            src/worker src/shared migrations wrangler.jsonc package.json package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Test fail-closed UAT guard with synthetic fixtures
        run: npx --no-install vitest run tests/uat-ui-release-guard.test.mjs
      - name: Build UI and Worker (no remote services)
        run: npm run build
      - name: Dry-run guarded UAT bundle, never access Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cfg="$(mktemp -u "$PWD/.uat-ui-preview-XXXXXXXX.jsonc")"
          trap 'rm -f "$cfg"' EXIT
          node scripts/uat-ui-release-guard.mjs prepare "$cfg"
          npx --no-install wrangler deploy --config "$cfg" --env uat --keep-vars --dry-run

  deploy:
    # No automatic deploy on push or PR. A separate explicit user approval
    # and manual workflow_dispatch from main are required to reach this job.
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Deploy only after exact-SHA and Worker metadata preflight
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = 'DEPLOY LIFELOG UAT UI ONLY'
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$TARGET_SHA"
          git merge-base --is-ancestor 54f2b4732baafbeb143ac2943867535e5a6f3b99 "$TARGET_SHA"
          git diff --exit-code 54f2b4732baafbeb143ac2943867535e5a6f3b99 "$TARGET_SHA" -- \
            src/worker src/shared migrations wrangler.jsonc package.json package-lock.json
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          umask 077
          cfg="$(mktemp -u "$PWD/.uat-ui-release-XXXXXXXX.jsonc")"
          before="$(mktemp -u "$RUNNER_TEMP/uat-bindings-XXXXXXXX.json")"
          trap 'rm -f "$cfg" "$before"' EXIT
          npm ci --no-audit --no-fund
          npm run build
          npx --no-install vitest run tests/uat-ui-release-guard.test.mjs
          node scripts/uat-ui-release-guard.mjs prepare "$cfg"
          # Fail-closed BEFORE Wrangler upload: GET live Worker settings, active deployment and version metadata.
          # Confirm rate limiter, runtime date/flags, assets routing, D1 and every auth/secret binding identity.
          # Unknown API fields, permissions or multi-version rollout stop here. No remote D1 request.
          node scripts/uat-ui-release-guard.mjs snapshot "$before"
          # Keep all deployed plaintext vars; omit stale config vars.
          # Cloudflare preserves existing secrets without --secrets-file.
          npx --no-install wrangler deploy --config "$cfg" --env uat --keep-vars
          node scripts/uat-ui-release-guard.mjs compare "$before"
          # Anonymous owner-only app must never return 200. No authenticated writes.
          for i in $(seq 1 12); do
            status="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' \
              https://life-log-uat.ha-rookie.workers.dev/ || true)"
            case "$status" in
              401|403|302|303|307) echo "Anonymous UAT access denied; UI release gate PASS"; exit 0 ;;
              200) echo "::error::Anonymous UAT leaked HTTP 200"; exit 1 ;;
              404|000|502|503) sleep 5 ;;
              *) echo "::error::Unexpected anonymous UAT HTTP $status"; exit 1 ;;
            esac
          done
          echo "::error::UAT propagation verification failed"; exit 1
