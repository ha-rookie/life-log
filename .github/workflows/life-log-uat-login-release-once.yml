name: Life-log one-shot UAT login diagnostics release

on:
  workflow_run:
    workflows: ["Life-log local app and D1 CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: life-log-uat-login-diagnostics-once
  cancel-in-progress: false

jobs:
  deploy-login-diagnostics:
    if: >-
      github.repository == 'ha-rookie/life-log' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_commit.message, 'chore(uat): one-time login diagnostics Worker release')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      UAT_URL: https://life-log-uat.ha-rookie.workers.dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify one-shot main SHA and exact approved workflow-only commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$TARGET_SHA"
          test "$(git show -s --format=%s HEAD)" = 'chore(uat): one-time login diagnostics Worker release'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = '.github/workflows/life-log-uat-login-release-once.yml'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')
            .split(/\r?\n/).filter(x=>!x.trimStart().startsWith('//')).join('\n'));
          const u=data.env?.uat,d=u?.d1_databases,bindings=u?.unsafe?.bindings??[];
          if(u?.name!=='life-log-uat'||u.workers_dev!==true||d?.length!==1||
             d[0].binding!=='DB'||d[0].database_name!=='life-log-dev'||
             d[0].database_id!=='421d0116-5c33-4782-a2b6-28f9684d3956'||
             u.vars?.MANUAL_REMOTE_WRITE_ENABLED!=='false'||
             u.vars?.MANUAL_REMOTE_TARGET!=='uat'||
             u.vars?.MANUAL_REMOTE_ORIGIN!=='https://life-log-uat.ha-rookie.workers.dev'||
             !bindings.some(x=>x.name==='AUTH_RATE_LIMITER'&&x.type==='ratelimit')||
             u.assets?.run_worker_first!==true)
            throw Error('Unexpected UAT target/config; refuse deploy');
          const html=fs.readFileSync('src/worker/login-screen.ts','utf8');
          if(!html.includes('認証サーバーが利用できません（503）')||
             !html.includes('試行回数の制限中です（429）')||
             !html.includes('認証情報が一致しません（401）'))
            throw Error('Login diagnostic UI not present at approved main SHA');
          JS
      - name: Install locked dependencies and build
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Read-only verify existing UAT D1 metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/421d0116-5c33-4782-a2b6-28f9684d3956" \
            | jq -e '.success == true and .result.uuid == "421d0116-5c33-4782-a2b6-28f9684d3956" and .result.name == "life-log-dev"' >/dev/null
      - name: Deploy approved build to existing password-only UAT Worker
        shell: bash
        run: |
          set -euo pipefail
          # Same UAT Worker and existing D1; no migrations or credential writes.
          npx --no-install wrangler deploy --env uat \
            --var PASSWORD_ONLY_UAT:true MANUAL_REMOTE_WRITE_ENABLED:true \
                  MANUAL_REMOTE_TARGET:uat \
                  MANUAL_REMOTE_ORIGIN:https://life-log-uat.ha-rookie.workers.dev
      - name: Verify UAT HTTP 403/200 and diagnostic page version
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 12); do
            root=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$UAT_URL/" || true)
            api=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$UAT_URL/api/summary" || true)
            login=$(curl -sS --max-time 15 -o "$RUNNER_TEMP/life-log-login.html" -w '%{http_code}' "$UAT_URL/login" || true)
            if [[ "$root" == 403 && "$api" == 403 && "$login" == 200 ]] &&
               grep -Fq '認証サーバーが利用できません（503）' "$RUNNER_TEMP/life-log-login.html" &&
               grep -Fq '試行回数の制限中です（429）' "$RUNNER_TEMP/life-log-login.html"; then
              {
                echo '### UAT login diagnostic release: verified'
                echo "- Main: $TARGET_SHA"
                echo "- Existing Worker: $UAT_URL"
                echo '- Anonymous root 403; anonymous API 403; login page 200'
                echo '- Login diagnostic messages present in live HTML'
                echo '- No D1 Migration, Secrets changes, or Owner registration'
                echo '- Actual Owner password login: NOT tested'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$root" == 200 || "$api" == 200 ]]; then
              echo 'SECURITY: unprotected private endpoint detected' >&2
              exit 1
            fi
            [[ "$n" -eq 12 ]] && break
            sleep 5
          done
          echo "UAT verification failed: root=$root api=$api login=$login" >&2
          exit 1
