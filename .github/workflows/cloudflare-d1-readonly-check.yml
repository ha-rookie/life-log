name: Cloudflare credential and development D1 read-only check

# Remote Cloudflare metadata is NEVER read on an automatic push/PR.
# Explicit manual dispatch on an approved exact main SHA is the only entrypoint.
# This gate itself is reviewed as a Draft PR and has no external effect until
# a separately authorized main merge. No remote read is performed in PR CI.
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Explicitly approved exact 40-character main SHA'
        type: string
        required: true
      confirmation:
        description: 'Enter READ LIFELOG D1 METADATA only after separate authorization'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: life-log-cloudflare-readonly-check-manual
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'ha-rookie/life-log' &&
      inputs.confirmation == 'READ LIFELOG D1 METADATA'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_D1_ID: '421d0116-5c33-4782-a2b6-28f9684d3956'
      EXPECTED_D1_NAME: life-log-dev
    steps:
      - name: Require exact explicitly approved current main SHA before any remote access
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REPOSITORY" = 'ha-rookie/life-log'
          test "$CONFIRMATION" = 'READ LIFELOG D1 METADATA'
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$TARGET_SHA"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$TARGET_SHA"
          echo 'Explicitly confirmed main SHA. Read-only verification permitted by this manually dispatched job.'
      - name: Confirm secrets are populated
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then echo 'Cloudflare account ID format is invalid'; exit 1; fi
          echo 'Cloudflare GitHub Actions secrets are present (values never shown).'
      - name: Verify token status (GET only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --max-time 20 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          if ! jq -e '.success == true and .result.status == "active"' <<< "$response" > /dev/null; then
            echo 'Cloudflare token verification failed'; exit 1;
          fi
          echo 'Cloudflare API token active.'
      - name: Check development D1 metadata (GET only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --max-time 20 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$EXPECTED_D1_ID")
          if ! jq -e --arg uuid "$EXPECTED_D1_ID" --arg name "$EXPECTED_D1_NAME" \
            '.success == true and .result.uuid == $uuid and .result.name == $name' <<< "$response" > /dev/null; then
            echo 'D1 read permission or database metadata mismatch'; exit 1;
          fi
          echo 'Development D1 metadata verified: name and UUID match.'
          {
            echo '### Read-only Cloudflare validation'
            echo '- Trigger: manually authorized workflow_dispatch, exact current main SHA'
            echo '- API token: active'
            echo '- GitHub secrets: present'
            echo '- Development D1 metadata: name/UUID match'
            echo '- Remote D1 writes, SQL, migrations, and deployments: not executed'
          } >> "$GITHUB_STEP_SUMMARY"
